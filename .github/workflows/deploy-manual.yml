name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        name: Select deployment targets
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          echo "$changed_files"

          backend=false
          frontend=false

          if grep -Eq '^backend/' <<< "$changed_files"; then
            backend=true
          fi

          if grep -Eq '^frontend/' <<< "$changed_files"; then
            frontend=true
          fi

          if grep -Fxq '.github/workflows/deploy-manual.yml' <<< "$changed_files"; then
            backend=true
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  test-backend:
    name: Verify backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crow_test
          POSTGRES_USER: crow
          POSTGRES_PASSWORD: crow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://crow:crow@localhost:5432/crow_test
      REDIS_URL: redis://localhost:6379/0
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Verify migrations
        run: |
          test "$(alembic heads | grep -c .)" -eq 1
          alembic upgrade head
        working-directory: backend

      - name: Run tests
        run: pytest tests/ -v
        working-directory: backend

  test-frontend:
    name: Verify frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Run tests
        run: yarn test
        working-directory: frontend

      - name: Build
        run: yarn build
        working-directory: frontend

  deploy-backend:
    name: Deploy Railway
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true' && needs.test-backend.result == 'success'
    runs-on: ubuntu-latest
    environment: backend-production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy API
        run: railway up --service api --ci --message "GitHub Actions ${GITHUB_SHA}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for API
        run: curl --fail --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors "${{ vars.BACKEND_URL }}/api/grid" > /dev/null

      - name: Deploy worker
        run: railway up --service worker --ci --message "GitHub Actions ${GITHUB_SHA}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy beat
        run: railway up --service beat --ci --message "GitHub Actions ${GITHUB_SHA}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Vercel
    needs: [changes, test-frontend]
    if: needs.changes.outputs.frontend == 'true' && needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    environment: frontend-production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build frontend
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Smoke test frontend routes
        run: |
          for path in / /explore /grid; do
            curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.FRONTEND_URL }}${path}" > /dev/null
          done

      - name: Smoke test frontend API target
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "${{ vars.VITE_API_BASE_URL }}/api/grid" > /dev/null
