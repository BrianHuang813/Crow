name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crow_test
          POSTGRES_USER: crow
          POSTGRES_PASSWORD: crow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://crow:crow@localhost:5432/crow_test
      REDIS_URL: redis://localhost:6379/0
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Check single migration head
        run: |
          n=$(alembic heads | grep -c .)
          if [ "$n" -ne 1 ]; then
            echo "::error::Multiple migration heads detected — rebase your branch and fix down_revision"
            alembic heads
            exit 1
          fi
        working-directory: backend

      - name: Check migrations apply cleanly
        run: alembic upgrade head
        working-directory: backend

      - name: Run tests
        run: pytest tests/ -v
        working-directory: backend

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Run tests
        run: yarn test
        working-directory: frontend

      - name: Build (typecheck + bundle)
        run: yarn build
        working-directory: frontend
